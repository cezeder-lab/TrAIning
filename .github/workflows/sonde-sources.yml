# Temporaire : diagnostic des sources de données nutritionnelles.
name: Sonde sources
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/probe-sources.mjs']
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node scripts/probe-sources.mjs
